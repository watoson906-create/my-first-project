<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  .timer-container {
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  svg.ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 8;
  }

  .progress {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease;
  }

  .center-content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #ffffff;
  }

  .time-display {
    font-size: 48px;
    font-weight: 200;
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
  }

  .controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
  }

  .btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .btn:active {
    transform: scale(0.92);
  }

  .btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  .time-setter {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .preset-btn {
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.6);
    font-size: 11px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
  }

  .preset-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .preset-btn.active {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.4);
  }

  /* Finished state pulse */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .finished .time-display {
    animation: pulse 1.2s ease-in-out infinite;
  }

  /* Background blur circle */
  .bg-blur {
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
</style>
</head>
<body>

<div class="timer-container" id="timerContainer">
  <div class="bg-blur"></div>

  <svg class="ring" viewBox="0 0 280 280">
    <circle class="track" cx="140" cy="140" r="126"></circle>
    <circle class="progress" id="progress" cx="140" cy="140" r="126"></circle>
  </svg>

  <div class="center-content">
    <div class="time-display" id="timeDisplay">05:00</div>

    <div class="controls">
      <button class="btn" id="btnStart" title="Start">
        <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
      </button>
      <button class="btn" id="btnPause" title="Pause" style="display:none;">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
      </button>
      <button class="btn" id="btnReset" title="Reset">
        <svg viewBox="0 0 24 24"><path d="M12,4 C7.6,4 4,7.6 4,12 C4,16.4 7.6,20 12,20 C15.7,20 18.8,17.4 19.7,14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="20,4 20,10 14,10"/></svg>
      </button>
    </div>

    <div class="time-setter">
      <button class="preset-btn" data-time="60">1m</button>
      <button class="preset-btn" data-time="180">3m</button>
      <button class="preset-btn active" data-time="300">5m</button>
      <button class="preset-btn" data-time="600">10m</button>
      <button class="preset-btn" data-time="1500">25m</button>
    </div>
  </div>
</div>

<script>
  const progress = document.getElementById('progress');
  const timeDisplay = document.getElementById('timeDisplay');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnReset = document.getElementById('btnReset');
  const container = document.getElementById('timerContainer');
  const presetBtns = document.querySelectorAll('.preset-btn');

  const CIRCUMFERENCE = 2 * Math.PI * 126;
  progress.style.strokeDasharray = CIRCUMFERENCE;
  progress.style.strokeDashoffset = '0';

  let totalSeconds = 300;
  let remainingSeconds = 300;
  let timerInterval = null;
  let isRunning = false;

  function getColor(fraction) {
    if (fraction > 0.5) {
      return '#4fd1c5';
    } else if (fraction > 0.2) {
      return '#f6ad55';
    } else {
      return '#fc8181';
    }
  }

  function updateDisplay() {
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    timeDisplay.textContent =
      String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

    const fraction = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
    const offset = CIRCUMFERENCE * (1 - fraction);
    progress.style.strokeDashoffset = offset;
    progress.style.stroke = getColor(fraction);
  }

  function startTimer() {
    if (remainingSeconds <= 0) return;
    isRunning = true;
    btnStart.style.display = 'none';
    btnPause.style.display = 'flex';
    container.classList.remove('finished');

    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateDisplay();

      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
        btnPause.style.display = 'none';
        btnStart.style.display = 'flex';
        container.classList.add('finished');
        timeDisplay.textContent = '00:00';

        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('Timer', { body: 'Time is up!' });
        }
      }
    }, 1000);
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    btnPause.style.display = 'none';
    btnStart.style.display = 'flex';
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    remainingSeconds = totalSeconds;
    btnPause.style.display = 'none';
    btnStart.style.display = 'flex';
    container.classList.remove('finished');
    updateDisplay();
  }

  function setPreset(seconds, btn) {
    if (isRunning) return;
    totalSeconds = seconds;
    remainingSeconds = seconds;
    presetBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    container.classList.remove('finished');
    updateDisplay();
  }

  btnStart.addEventListener('click', startTimer);
  btnPause.addEventListener('click', pauseTimer);
  btnReset.addEventListener('click', resetTimer);

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setPreset(parseInt(btn.dataset.time, 10), btn);
    });
  });

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  updateDisplay();
</script>

</body>
</html>
