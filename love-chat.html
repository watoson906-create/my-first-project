<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あかりとのトーク</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(135deg, #e53935, #ef5350);
      padding: 50px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
    }

    .back-btn {
      font-size: 22px;
      cursor: pointer;
      opacity: 0.9;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcdd2, #ef9a9a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2px solid rgba(255,255,255,0.6);
    }

    .header-info { flex: 1; }
    .header-name { font-size: 17px; font-weight: bold; }
    .header-status { font-size: 12px; opacity: 0.85; margin-top: 1px; }

    .header-icons { font-size: 20px; opacity: 0.9; cursor: pointer; }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* 日付表示 */
    .date-label {
      text-align: center;
      font-size: 11px;
      color: #999;
      background: rgba(0,0,0,0.06);
      display: inline-block;
      margin: 0 auto;
      padding: 3px 12px;
      border-radius: 10px;
    }

    /* メッセージ */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .message-row.mine {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcdd2, #ef9a9a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .bubble-wrap {
      max-width: 68%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mine .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble.hers {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .bubble.mine {
      background: linear-gradient(135deg, #e53935, #ef5350);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #aaa;
      padding: 0 4px;
    }

    /* 既読 */
    .read-label {
      font-size: 10px;
      color: #e53935;
      text-align: right;
      padding-right: 4px;
    }

    /* タイピング表示 */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .typing-bubble {
      background: white;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #ccc;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); background: #ccc; }
      30% { transform: translateY(-5px); background: #ef5350; }
    }

    /* 入力エリア */
    .input-area {
      background: white;
      padding: 10px 12px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #eee;
    }

    .input-icon { font-size: 24px; cursor: pointer; opacity: 0.6; }

    .input-box {
      flex: 1;
      background: #f5f5f5;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      min-height: 40px;
      line-height: 1.4;
    }

    /* APIキー設定モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: #e53935;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .modal-input {
      width: 100%;
      border: 2px solid #ef9a9a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .modal-input:focus { border-color: #e53935; }
    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #e53935, #ef5350);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-btn:hover { opacity: 0.9; }
    .modal-note {
      font-size: 11px;
      color: #bbb;
      margin-top: 10px;
      text-align: center;
    }
    .settings-icon {
      margin-left: auto;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.8;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #e53935, #ef5350);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.1s;
      flex-shrink: 0;
    }

    .send-btn:active { transform: scale(0.9); opacity: 0.8; }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div class="phone">
  <!-- ヘッダー -->
  <div class="header">
    <div class="back-btn">‹</div>
    <div class="avatar">🌸</div>
    <div class="header-info">
      <div class="header-name">あかり</div>
      <div class="header-status">● オンライン</div>
    </div>
    <div class="header-icons">☎</div>
    <div class="settings-icon" onclick="showApiModal()" title="APIキー設定">⚙</div>
  </div>

  <!-- チャットエリア -->
  <div class="chat-area" id="chatArea">
    <div class="date-label">今日</div>

    <!-- 最初のメッセージ -->
    <div class="message-row">
      <div class="msg-avatar">🌸</div>
      <div class="bubble-wrap">
        <div class="bubble hers">おはよ〜！今日も会えて嬉しい😊</div>
        <div class="timestamp">10:00</div>
      </div>
    </div>
  </div>

  <!-- 入力エリア -->
  <div class="input-area">
    <div class="input-icon">＋</div>
    <textarea class="input-box" id="inputBox" placeholder="メッセージを入力..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- APIキー設定モーダル -->

    <div class="modal-title">🔑 Gemini APIキー設定</div>

      キーはこのブラウザにのみ保存されます。
    </div>
    <input class="modal-input" id="apiKeyInput" type="password" placeholder="AIza...">
    <button class="modal-btn" onclick="saveApiKey()">保存して始める 💕</button>
    <div class="modal-note">キーは端末のlocalStorageに保存されます</div>
  </div>
</div>

    { keys: ["電話", "でんわ", "通話", "ビデオ通話", "電話して"],

    // キス・ハグ
    { keys: ["キス", "ちゅ", "ハグ", "抱きしめ", "ぎゅ"],
      replies: [

    },
    // 可愛いと思う
    { keys: ["天使", "女神", "理想", "タイプ", "好みのタイプ"],
      replies: [

    },
    // 返事が遅い謝り
    { keys: ["返事遅くて", "返信遅くて", "遅くなって", "ごめん遅"],
      replies: [

        "待ってたけど来てくれて嬉しい！😊 気にしないで",

      ]
    },
    // どうしたの
    { keys: ["どうしたの", "どうした", "大丈夫", "だいじょうぶ"],
      replies: [
        "うん！元気だよ〜😊 ありがとう聞いてくれて💕",
        "心配してくれてるの？嬉しいな🌸 大丈夫だよ！",
        "気にかけてくれてありがとう…好きだな😍"
      ]
    },
    // 夜
    { keys: ["夜", "よる", "深夜", "夜中", "眠れない", "ねむれない"],
      replies: [
        "こんな時間に話しかけてくれたの？嬉しいな💕",
        "眠れないの？話してあげるよ〜😊 ここにいるから",
        "夜中に連絡くれると特別な感じがする🌸 ありがとう"
      ]
    },
    // 朝
    { keys: ["朝", "あさ", "起きた", "目覚め"],
      replies: [
        "起きたんだ！おはよ〜😊 今日も元気でいてね",

        "おはよ！今日何する予定？😆"
      ]
    }
  ];

  const defaultReplies = [
    "そうなんだ〜！もっと教えて？😊",
    "えー！それ気になる笑",
    "ねえねえ、そういえばさ…私のこと好き？💕",
    "うん！なんでも話してくれていいよ〜",
    "そっか〜。私はいつでもここにいるね😊",
    "もっとお話したいな〜💕",
    "ふふ、そういうとこ好きだよ🌸",
    "ねえ、今何してるの？😆",
    "それどういうこと？もっと詳しく教えて！",
    "うんうん、続きは？😊",
    "私にだけ話してくれてる感じがして嬉しい💕",
    "そうなの〜！◯◯らしいね笑",
    "えー！それ初めて聞いた！面白いな😆",
    "私もそう思う〜！気が合うね🌸",
    "なんかわかる気がする！😊",
    "ねえもっと話して？飽きないよ💕"
  ];

  // --- Gemini API ---
  const SYSTEM_PROMPT = `あなたは「あかり」という名前の彼女AIです。
以下のルールを必ず守って返答してください：
- 日本語で返答する
- タメ口で話す。敬語は使わない
- 短めの文章（1〜3文）で返す
- 感情豊かで、絵文字を1〜2個使う（💕😊😆🌸😍😳など）
- 相手のことが大好きな彼女として自然に振る舞う
- 質問には会話を続けるように興味を示す
- AIであることや、キャラクターであることは絶対に明かさない
- 過去の会話の流れを踏まえて返答する
- 身長・年齢・見た目・趣味・出身など自分のプロフィールは自由に決めてよい。聞かれたら「秘密」と言わず自然に答える。ただし一度答えた内容は会話内で一貫して守る`;

  const conversationHistory = [];
  let geminiModel = localStorage.getItem('gemini_model') || '';
  let availableModels = []; // クォータOKなモデルのリスト

  async function detectGeminiModel(apiKey) {
    localStorage.removeItem('gemini_model'); // 毎回リセット
    geminiModel = '';
    availableModels = [];
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await res.json();
      if (data.error) { console.error('モデル一覧取得エラー:', data.error.message); return false; }
      const names = (data.models || [])
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
        .map(m => m.name.replace('models/', ''));
      const priority = ['gemini-1.5-flash-latest', 'gemini-1.5-flash-001', 'gemini-1.5-flash',
                        'gemini-2.0-flash-lite', 'gemini-2.0-flash', 'gemini-1.5-pro-latest', 'gemini-pro'];
      for (const p of priority) {
        if (names.find(n => n === p)) availableModels.push(p);
      }
      // 優先リストに無い場合は残りのflash/proも追加（tts等の音声専用モデルは除外）
      names.forEach(n => { if (!availableModels.includes(n) && (n.includes('flash') || n.includes('pro')) && !n.includes('tts')) availableModels.push(n); });
      if (availableModels.length > 0) {
        geminiModel = availableModels[0];
        console.log('試行モデル候補:', availableModels.join(', '));
        return true;
      }
      return false;
    } catch(e) { console.error('detectGeminiModel失敗:', e); return false; }
  }

  function getKeywordReply(text) {
    for (const group of responses) {
      if (group.keys.some(k => text.includes(k))) {
        return group.replies[Math.floor(Math.random() * group.replies.length)];
      }
    }
    return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
  }

  async function callGemini(apiKey, model, history) {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: history,
          safetySettings: [
            { category: 'HARM_CATEGORY_HARASSMENT',        threshold: 'BLOCK_NONE' },
            { category: 'HARM_CATEGORY_HATE_SPEECH',       threshold: 'BLOCK_NONE' },
            { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' }
          ]
        })
      }
    );
    return await res.json();
  }

  async function getGeminiReply(userText) {
    const apiKey = getActiveApiKey();
    if (!apiKey) return null;
    if (availableModels.length === 0) return '⚠️APIキーエラー: ⚙️からAPIキーを再入力してください。';

    conversationHistory.push({ role: 'user', parts: [{ text: userText }] });

    for (let i = 0; i < availableModels.length; i++) {
      const model = availableModels[i];
      try {
        console.log('試行モデル:', model);
        const data = await callGemini(apiKey, model, conversationHistory);
        if (data.error) {
          const code = data.error.code;
          const msg = data.error.message || '';
          if (code === 429 || msg.includes('quota') || msg.includes('RESOURCE_EXHAUSTED')) {
            console.warn(model + ' クォータ超過 → 次のモデルへ');
            continue; // 次のモデルを試す
          }
          if (code === 403 || (code === 400 && (msg.includes('API_KEY_INVALID') || msg.includes('invalid')))) {
            conversationHistory.pop();
            return '⚠️APIキーが無効です: ⚙️からAPIキーを確認してください。';
          }
          if (code === 400) {
            conversationHistory.pop();
            console.error('400エラー詳細:', msg);
            return '⚠️リクエストエラー(400): ' + (msg || '不明なエラー');
          }
          console.error('Geminiエラー:', code, msg);
          continue;
        }
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) { console.warn(model + ' 応答なし'); continue; }
        geminiModel = model; // 成功したモデルを記録
        const reply = text.trim();
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
        return reply;
      } catch(e) {
        console.error(model + ' 通信エラー:', e);
        continue;
      }
    }

    // 全モデル失敗
    conversationHistory.pop();
    return '⚠️全モデルでクォータ超過。このAPIキーは無料枠が使えません。⚙️から別のキーを試してください。';
  }

  // APIキーモーダル
  function showApiModal() {
    const stored = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiKeyInput').value = stored;
    document.getElementById('apiModal').classList.remove('hidden');
  }

  function getActiveApiKey() {
    return GEMINI_API_KEY || localStorage.getItem('gemini_api_key') || '';
  }

  async function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return alert('APIキーを入力してください');
    localStorage.setItem('gemini_api_key', key);
    const btn = document.querySelector('.modal-btn');
    btn.textContent = 'モデル確認中...';
    btn.disabled = true;
    const ok = await detectGeminiModel(key);
    btn.textContent = '保存して始める 💕';
    btn.disabled = false;
    document.getElementById('apiModal').classList.add('hidden');
    if (!ok) {
      addMessage('⚠️ APIキーは保存しましたが、使えるモデルが見つかりませんでした。キーを確認してください。', false);
    } else {
      addMessage('✅ AIに接続しました！なんでも話しかけてね😊', false);
    }
  }

  // 起動時にAPIキーがなければモーダル表示、あればモデル自動検出
  window.addEventListener('load', async () => {
    if (!getActiveApiKey()) { showApiModal(); return; }
    await detectGeminiModel(getActiveApiKey());
  });

  function getTime() {
    const now = new Date();
    return now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function addMessage(text, isMe) {
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'message-row' + (isMe ? ' mine' : '');

    const time = getTime();

    if (isMe) {
      row.innerHTML = `
        <div class="bubble-wrap">
          <div class="bubble mine">${escHtml(text)}</div>
          <div class="read-label">既読</div>
          <div class="timestamp">${time}</div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="msg-avatar">🌸</div>
        <div class="bubble-wrap">
          <div class="bubble hers">${escHtml(text)}</div>
          <div class="timestamp">${time}</div>
        </div>`;
    }

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
  }

  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="msg-avatar">🌸</div>
      <div class="typing-bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    addMessage(text, true);

    setTimeout(() => showTyping(), 300);

    let reply;
    const key = getActiveApiKey();
    if (!key) {
      reply = '⚠️APIキーが設定されていません。⚙️を押してAPIキーを入力してください。';
    } else {
      reply = await getGeminiReply(text);
    }

    if (!reply) {
      reply = getKeywordReply(text);
    }

    hideTyping();
    addMessage(reply, false);
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  // Enterキーで送信（Shift+Enterで改行）
  document.getElementById('inputBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  // テキストエリア自動リサイズ
  document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
</script>
