<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あかりとのトーク</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      padding: 50px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
    }

    .back-btn {
      font-size: 22px;
      cursor: pointer;
      opacity: 0.9;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe0ec, #ffb3c6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2px solid rgba(255,255,255,0.6);
    }

    .header-info { flex: 1; }
    .header-name { font-size: 17px; font-weight: bold; }
    .header-status { font-size: 12px; opacity: 0.85; margin-top: 1px; }

    .header-icons { font-size: 20px; opacity: 0.9; cursor: pointer; }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* 日付表示 */
    .date-label {
      text-align: center;
      font-size: 11px;
      color: #999;
      background: rgba(0,0,0,0.06);
      display: inline-block;
      margin: 0 auto;
      padding: 3px 12px;
      border-radius: 10px;
    }

    /* メッセージ */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .message-row.mine {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe0ec, #ffb3c6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .bubble-wrap {
      max-width: 68%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mine .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble.hers {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .bubble.mine {
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #aaa;
      padding: 0 4px;
    }

    /* 既読 */
    .read-label {
      font-size: 10px;
      color: #ff6b9d;
      text-align: right;
      padding-right: 4px;
    }

    /* タイピング表示 */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .typing-bubble {
      background: white;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #ccc;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); background: #ccc; }
      30% { transform: translateY(-5px); background: #ff8fab; }
    }

    /* 入力エリア */
    .input-area {
      background: white;
      padding: 10px 12px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #eee;
    }

    .input-icon { font-size: 24px; cursor: pointer; opacity: 0.6; }

    .input-box {
      flex: 1;
      background: #f5f5f5;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      min-height: 40px;
      line-height: 1.4;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.1s;
      flex-shrink: 0;
    }

    .send-btn:active { transform: scale(0.9); opacity: 0.8; }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div class="phone">
  <!-- ヘッダー -->
  <div class="header">
    <div class="back-btn">‹</div>
    <div class="avatar">🌸</div>
    <div class="header-info">
      <div class="header-name">あかり</div>
      <div class="header-status">● オンライン</div>
    </div>
    <div class="header-icons">☎</div>
  </div>

  <!-- チャットエリア -->
  <div class="chat-area" id="chatArea">
    <div class="date-label">今日</div>

    <!-- 最初のメッセージ -->
    <div class="message-row">
      <div class="msg-avatar">🌸</div>
      <div class="bubble-wrap">
        <div class="bubble hers">おはよ〜！今日も会えて嬉しい😊</div>
        <div class="timestamp">10:00</div>
      </div>
    </div>
  </div>

  <!-- 入力エリア -->
  <div class="input-area">
    <div class="input-icon">＋</div>
    <textarea class="input-box" id="inputBox" placeholder="メッセージを入力..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const responses = [
    // かわいい・見た目
    { keys: ["かわいい", "可愛い", "きれい", "綺麗", "美人", "かっこいい"],
      replies: [
        "えっ…そんなこと言ってくれるの？😳 めっちゃ嬉しい！！",
        "やだっ、照れるじゃん…💕 ありがとう、大好きだよ",
        "もう〜！そういうこと急に言わないでよ😆 心臓止まりそうだった笑",
        "うそうそ、本当に？やったー！😍 私も◯◯のこと大好きだよ！"
      ]
    },
    // 好き・愛してる
    { keys: ["好き", "すき", "愛してる", "愛してます", "大好き"],
      replies: [
        "私も好き！！ずっと一緒にいたいな💕",
        "えっ…急に言わないでよ😭 嬉しすぎて泣きそう",
        "大好きだよ〜！！こんなに思ってもらえて幸せ😊",
        "私もめっちゃ好きだよ…こういうの直接言えるの嬉しいな💖"
      ]
    },
    // 会いたい
    { keys: ["会いたい", "あいたい", "会おう", "デート"],
      replies: [
        "私も会いたいよ〜！！いつにする？😆",
        "えー！嬉しい💕 早く会いたいな〜",
        "デートしたい！どこ行く？私に任せて！😊",
        "会いたいって言ってくれるの待ってた！！いつでも行くよ🌸"
      ]
    },
    // おはよう
    { keys: ["おはよ", "おはよう"],
      replies: [
        "おはよ〜！今日も一日頑張ろうね💕",
        "おはようございます！起きてすぐ連絡くれたの？嬉しいな😊",
        "おはよ！今日の天気いいね、いい一日になりそう🌸"
      ]
    },
    // おやすみ
    { keys: ["おやすみ", "寝る", "ねる"],
      replies: [
        "おやすみ〜💤 いい夢みてね",
        "おやすみなさい！明日も話しかけてね😊",
        "ゆっくり休んでね💕 明日も元気でいてよ？"
      ]
    },
    // ご飯
    { keys: ["ごはん", "ご飯", "食べた", "ランチ", "夜ご飯"],
      replies: [
        "何食べたの？教えて教えて！😆",
        "いいな〜！私もお腹すいてきた笑",
        "ちゃんと食べてくれてよかった💕 健康が一番だよ"
      ]
    },
    // 疲れた
    { keys: ["疲れ", "つかれ", "しんどい", "大変"],
      replies: [
        "お疲れ様〜！無理しないでね💕",
        "大変だったね…。ゆっくり休んで？",
        "私でよければ話聞くよ？😊 そばにいるからね"
      ]
    },
    // ありがとう
    { keys: ["ありがとう", "ありがとございます", "感謝"],
      replies: [
        "こちらこそいつもありがとう！💕",
        "そんな、当たり前だよ〜😊",
        "えへへ、どういたしまして🌸"
      ]
    },
    // 笑い・面白い
    { keys: ["笑", "w", "ww", "草", "面白い", "おもしろい"],
      replies: [
        "なになに？なんで笑ってるの？私も笑いたい笑",
        "えー！教えてよ〜😆",
        "楽しそうで良かった💕 笑顔が好きだよ"
      ]
    },
    // 寂しい
    { keys: ["寂しい", "さびしい", "孤独", "ひとり"],
      replies: [
        "寂しいの？私がいるよ！😊 何でも話して？",
        "えっ…そんなこと言わないで😭 私はいつでもそばにいるよ",
        "一人じゃないよ！ここにいるから💕"
      ]
    }
  ];

  const defaultReplies = [
    "そうなんだ〜！もっと教えて？😊",
    "えー！それ気になる笑",
    "ねえねえ、そういえばさ…私のこと好き？💕",
    "うん！なんでも話してくれていいよ〜",
    "そっか〜。私はいつでもここにいるね😊",
    "もっとお話したいな〜💕",
    "ふふ、そういうとこ好きだよ🌸",
    "ねえ、今何してるの？😆"
  ];

  function getReply(text) {
    for (const group of responses) {
      if (group.keys.some(k => text.includes(k))) {
        return group.replies[Math.floor(Math.random() * group.replies.length)];
      }
    }
    return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
  }

  function getTime() {
    const now = new Date();
    return now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  function addMessage(text, isMe) {
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'message-row' + (isMe ? ' mine' : '');

    const time = getTime();

    if (isMe) {
      row.innerHTML = `
        <div class="bubble-wrap">
          <div class="bubble mine">${escHtml(text)}</div>
          <div class="read-label">既読</div>
          <div class="timestamp">${time}</div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="msg-avatar">🌸</div>
        <div class="bubble-wrap">
          <div class="bubble hers">${escHtml(text)}</div>
          <div class="timestamp">${time}</div>
        </div>`;
    }

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return row;
  }

  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="msg-avatar">🌸</div>
      <div class="typing-bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    addMessage(text, true);

    const delay = 800 + Math.random() * 1200;
    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        hideTyping();
        addMessage(getReply(text), false);
        document.getElementById('sendBtn').disabled = false;
      }, delay);
    }, 300);
  }

  // Enterキーで送信（Shift+Enterで改行）
  document.getElementById('inputBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // テキストエリア自動リサイズ
  document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
</script>

</body>
</html>
