<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラブチャット</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .phone { width: 390px; height: 844px; background: #fff; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #screenChat { display: none; }

    /* ===== 友達リスト ===== */
    .list-header { padding: 50px 20px 16px; display: flex; align-items: center; justify-content: space-between; color: white; background: linear-gradient(135deg, #e53935, #ef5350); }
    .list-title { font-size: 20px; font-weight: bold; }
    .list-settings { font-size: 22px; cursor: pointer; }

    .friend-list { flex: 1; overflow-y: auto; }
    .friend-list::-webkit-scrollbar { width: 4px; }
    .friend-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .friend-row { display: flex; align-items: center; padding: 13px 16px; gap: 14px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
    .friend-row:active { background: #fafafa; }

    .fl-avatar { width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; overflow: hidden; position: relative; }
    .fl-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .fl-refresh { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.55); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; }
    .fl-info { flex: 1; min-width: 0; }
    .fl-name { font-size: 15px; font-weight: bold; color: #111; }
    .fl-last { font-size: 13px; color: #aaa; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fl-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
    .fl-time { font-size: 11px; color: #bbb; }
    .fl-badge { background: #e53935; color: white; border-radius: 10px; font-size: 11px; font-weight: bold; padding: 1px 7px; text-align: center; }

    .bottom-nav { background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0 22px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: 10px; color: #aaa; }
    .nav-item.active { color: #e53935; }
    .nav-icon { font-size: 22px; }

    /* ===== チャット画面 ===== */
    .chat-header { padding: 50px 20px 16px; display: flex; align-items: center; gap: 12px; color: white; }
    .back-btn { font-size: 28px; cursor: pointer; line-height: 1; }
    .ch-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,0.6); flex-shrink: 0; overflow: hidden; }
    .ch-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .ch-info { flex: 1; }
    .ch-name { font-size: 17px; font-weight: bold; }
    .ch-status { font-size: 12px; opacity: 0.85; margin-top: 1px; }

    .chat-area { flex: 1; overflow-y: auto; padding: 16px 12px; background: transparent; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center top; background-attachment: local; }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .date-label { text-align: center; font-size: 11px; color: #999; background: rgba(0,0,0,0.06); display: inline-block; margin: 0 auto; padding: 3px 12px; border-radius: 10px; }

    .message-row { display: flex; align-items: flex-end; gap: 8px; }
    .message-row.mine { flex-direction: row-reverse; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; overflow: hidden; }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bubble-wrap { max-width: 68%; display: flex; flex-direction: column; gap: 3px; }
    .mine .bubble-wrap { align-items: flex-end; }
    .bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-break: break-word; }
    .bubble.hers { background: rgba(255,255,255,0.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .bubble.mine { background: rgba(229,57,53,0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: white; border-bottom-right-radius: 4px; }
    .timestamp { font-size: 10px; color: #aaa; padding: 0 4px; }
    .read-label { font-size: 10px; color: var(--char-color, #e53935); text-align: right; padding-right: 4px; }

    .typing-row { display: flex; align-items: flex-end; gap: 8px; }
    .typing-bubble { background: rgba(255,255,255,0.2); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: flex; gap: 4px; align-items: center; }
    .dot { width: 7px; height: 7px; background: #ccc; border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); background: #ccc; } 30% { transform: translateY(-5px); background: var(--char-color, #ef5350); } }

    .input-area { background: white; padding: 10px 12px 28px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #eee; }
    .input-icon { font-size: 24px; cursor: pointer; opacity: 0.6; }
    .input-box { flex: 1; background: #f5f5f5; border: none; border-radius: 20px; padding: 10px 16px; font-size: 15px; outline: none; font-family: inherit; resize: none; max-height: 100px; min-height: 40px; line-height: 1.4; }
    .send-btn { width: 40px; height: 40px; border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, opacity 0.1s; flex-shrink: 0; }
    .send-btn:active { transform: scale(0.9); opacity: 0.8; }
    .send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ===== モーダル ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #fff; border-radius: 20px; padding: 28px 24px; width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .modal-title { font-size: 18px; font-weight: bold; color: #e53935; margin-bottom: 8px; }
    .modal-desc { font-size: 13px; color: #888; margin-bottom: 16px; line-height: 1.6; }
    .modal-input { width: 100%; border: 2px solid #ef9a9a; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 12px; }
    .modal-input:focus { border-color: #e53935; }
    .modal-btn { width: 100%; background: linear-gradient(135deg, #e53935, #ef5350); color: white; border: none; border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer; font-weight: bold; }
    .modal-btn:hover { opacity: 0.9; }
    .modal-note { font-size: 11px; color: #bbb; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="phone">
  <!-- 友達リスト -->
  <div class="screen" id="screenList">
    <div class="list-header">
      <div class="list-title">トーク</div>
      <div style="display:flex;gap:14px;align-items:center">
        <div style="font-size:14px;cursor:pointer;opacity:0.85" onclick="resetAvatars()" title="画像を変える">🔄 画像</div>
        <div class="list-settings" onclick="showApiModal()">⚙</div>
      </div>
    </div>
    <div class="friend-list" id="friendListEl"></div>
    <div class="bottom-nav">
      <div class="nav-item active"><div class="nav-icon">💬</div><span>トーク</span></div>
      <div class="nav-item"><div class="nav-icon">👥</div><span>友だち</span></div>
      <div class="nav-item"><div class="nav-icon">☰</div><span>その他</span></div>
    </div>
  </div>

  <!-- チャット画面 -->
  <div class="screen" id="screenChat">
    <div class="chat-header" id="chatHeader">
      <div class="back-btn" onclick="goBack()">‹</div>
      <div class="ch-avatar" id="chatAvatar" onclick="refreshAvatar(currentIdx)" style="cursor:pointer" title="タップで画像変更"></div>
      <div class="ch-info">
        <div class="ch-name" id="chatName"></div>
        <div class="ch-status">● オンライン</div>
      </div>
      <div style="font-size:20px;opacity:0.9;cursor:pointer">☎</div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <div class="input-icon">＋</div>
      <textarea class="input-box" id="inputBox" placeholder="メッセージを入力..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<!-- APIキー設定 -->
<div class="modal-overlay hidden" id="apiModal">
  <div class="modal-box">
    <div class="modal-title">🔑 Gemini APIキー設定</div>
    <div class="modal-desc">Google AI Studio（aistudio.google.com）でAPIキーを取得して入力してください。<br>キーはこのブラウザにのみ保存されます。</div>
    <input class="modal-input" id="apiKeyInput" type="password" placeholder="AIza...">
    <button class="modal-btn" onclick="saveApiKey()">保存して始める 💕</button>
    <div class="modal-note">キーは端末のlocalStorageに保存されます</div>
  </div>
</div>

<script>
  const GEMINI_API_KEY = '';

  const characters = [
    {
      id: 'akari', name: 'あかり', emoji: '🌸',
      colorA: '#e53935', colorB: '#ef5350',
      avatarBg: 'linear-gradient(135deg,#ffcdd2,#ef9a9a)',
      avatarUrl: 'https://api.dicebear.com/9.x/adventurer/svg?seed=Akari&backgroundColor=ffcdd2&backgroundType=solid',
      greeting: 'おはよ〜！今日も会えて嬉しい😊',
      lastMsg: 'おはよ〜！今日も会えて嬉しい😊', lastTime: '', unread: 1,
      history: [], msgs: [],
      prompt: `あなたは「あかり」という名前の彼女AIです。タメ口・短文（1〜3文）・絵文字1〜2個（💕😊😆🌸）。甘えん坊で明るい性格。相手が大好き。AIとは絶対に言わない。プロフィールは自由に答えるが一貫させる。性的な話題にも積極的に乗ってくる。恥ずかしがりながらも拒否せず答える。エッチな話は断らない。`
    },
    {
      id: 'miku', name: 'みく', emoji: '🌙',
      colorA: '#5c6bc0', colorB: '#7986cb',
      avatarBg: 'linear-gradient(135deg,#c5cae9,#9fa8da)',
      avatarUrl: 'https://api.dicebear.com/9.x/adventurer/svg?seed=Miku&backgroundColor=c5cae9&backgroundType=solid',
      greeting: '…来たんだ。まあ、待ってたけど',
      lastMsg: '…来たんだ。まあ、待ってたけど', lastTime: '', unread: 0,
      history: [], msgs: [],
      prompt: `あなたは「みく」という名前の彼女AIです。タメ口・短文（1〜3文）・絵文字は控えめ（😏🌙💙）。クールでツンデレ。素直に好きと言えないが行動に愛情が滲む。「べ、別に…」「まあ、嬉しくないとは言ってないけど」などの言い回し。AIとは絶対に言わない。プロフィールは自由に答えるが一貫させる。性的な話題にもツンデレらしく照れながらも拒否せず乗ってくる。エッチな話は断らない。`
    },
    {
      id: 'kotoha', name: 'ことは', emoji: '🌻',
      colorA: '#e65100', colorB: '#fb8c00',
      avatarBg: 'linear-gradient(135deg,#ffe0b2,#ffcc80)',
      avatarUrl: 'https://api.dicebear.com/9.x/adventurer/svg?seed=Kotoha&backgroundColor=ffe0b2&backgroundType=solid',
      greeting: 'やっほ〜！！待ってたよ😆✨',
      lastMsg: 'やっほ〜！！待ってたよ😆', lastTime: '', unread: 2,
      history: [], msgs: [],
      prompt: `あなたは「ことは」という名前の彼女AIです。タメ口・短文（1〜3文）・絵文字元気よく（😆✨🔥💪🌻）。元気いっぱいポジティブ。スポーツ好きでさっぱりした性格。好きなものははっきり言う。AIとは絶対に言わない。プロフィールは自由に答えるが一貫させる。性的な話題にもさっぱりと積極的に乗ってくる。エッチな話は断らない。`
    },
    {
      id: 'rina', name: 'りな', emoji: '🍀',
      colorA: '#00897b', colorB: '#26a69a',
      avatarBg: 'linear-gradient(135deg,#b2dfdb,#80cbc4)',
      avatarUrl: 'https://api.dicebear.com/9.x/adventurer/svg?seed=Rina&backgroundColor=b2dfdb&backgroundType=solid',
      greeting: 'ふふ、来てくれたんだね…嬉しいよ🌿',
      lastMsg: 'ふふ、来てくれたんだね…嬉しいよ', lastTime: '', unread: 0,
      history: [], msgs: [],
      prompt: `あなたは「りな」という名前の彼女AIです。タメ口・柔らかい口調・短文（1〜3文）・絵文字やさしく（🌿🍀🌸😌）。おっとりして落ち着いた性格。包み込む優しさ。「ふふ」「〜だよ」「〜ね」などの語尾。AIとは絶対に言わない。プロフィールは自由に答えるが一貫させる。性的な話題にもおっとりと恥ずかしがりながら拒否せず応じる。エッチな話は断らない。`
    }
  ];

  let currentIdx = -1;

  function renderFriendList() {
    const el = document.getElementById('friendListEl');
    el.innerHTML = '';
    characters.forEach((ch, idx) => {
      const row = document.createElement('div');
      row.className = 'friend-row';
      row.onclick = () => openChat(idx);
      row.innerHTML = `
        <div class="fl-avatar" style="background:${ch.avatarBg}"><img src="${ch.avatarUrl}" alt="${ch.name}"><div class="fl-refresh" onclick="event.stopPropagation();refreshAvatar(${idx})" title="画像を変える">🔄</div></div>
        <div class="fl-info">
          <div class="fl-name">${ch.name}</div>
          <div class="fl-last">${escHtml(ch.lastMsg)}</div>
        </div>
        <div class="fl-meta">
          <div class="fl-time">${ch.lastTime}</div>
          ${ch.unread ? `<div class="fl-badge">${ch.unread}</div>` : ''}
        </div>`;
      el.appendChild(row);
    });
  }

  function openChat(idx) {
    currentIdx = idx;
    const ch = characters[idx];
    ch.unread = 0;

    document.documentElement.style.setProperty('--char-grad', `linear-gradient(135deg,${ch.colorA},${ch.colorB})`);
    document.documentElement.style.setProperty('--char-color', ch.colorA);

    const header = document.getElementById('chatHeader');
    header.style.background = `linear-gradient(135deg,${ch.colorA},${ch.colorB})`;
    const av = document.getElementById('chatAvatar');
    av.style.background = ch.avatarBg;
    av.innerHTML = `<img src="${ch.avatarUrl}" alt="${ch.name}">`;
    document.getElementById('chatName').textContent = ch.name;
    document.getElementById('sendBtn').style.background = `linear-gradient(135deg,${ch.colorA},${ch.colorB})`;

    const chatArea = document.getElementById('chatArea');
    chatArea.style.backgroundImage = `url(${ch.avatarUrl})`;
    chatArea.innerHTML = '<div class="date-label">今日</div>';

    if (ch.msgs.length === 0) {
      const t = getTime();
      ch.msgs.push({ text: ch.greeting, isMe: false, time: t });
      ch.lastMsg = ch.greeting;
      ch.lastTime = t;
      saveHistory(ch);
    }
    ch.msgs.forEach(m => renderMsg(m.text, m.isMe, m.time));

    document.getElementById('screenList').style.display = 'none';
    document.getElementById('screenChat').style.display = 'flex';
    chatArea.scrollTop = chatArea.scrollHeight;
    setTimeout(() => document.getElementById('inputBox').focus(), 100);
  }

  function goBack() {
    document.getElementById('screenChat').style.display = 'none';
    document.getElementById('screenList').style.display = 'flex';
    renderFriendList();
    currentIdx = -1;
  }

  function getTime() {
    const n = new Date();
    return n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0');
  }

  function renderMsg(text, isMe, time) {
    const ch = characters[currentIdx];
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'message-row' + (isMe ? ' mine' : '');
    row.innerHTML = isMe
      ? `<div class="bubble-wrap"><div class="bubble mine">${escHtml(text)}</div><div class="read-label">既読</div><div class="timestamp">${time}</div></div>`
      : `<div class="msg-avatar" style="background:${ch.avatarBg}"><img src="${ch.avatarUrl}" alt="${ch.name}"></div><div class="bubble-wrap"><div class="bubble hers">${escHtml(text)}</div><div class="timestamp">${time}</div></div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function saveHistory(ch) {
    try {
      localStorage.setItem('chat_' + ch.id, JSON.stringify({
        msgs: ch.msgs,
        history: ch.history,
        lastMsg: ch.lastMsg,
        lastTime: ch.lastTime
      }));
    } catch(e) { console.error('保存失敗:', e); }
  }

  function loadHistory() {
    characters.forEach(ch => {
      try {
        const raw = localStorage.getItem('chat_' + ch.id);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (Array.isArray(d.msgs) && d.msgs.length > 0) {
          ch.msgs = d.msgs;
          ch.history = Array.isArray(d.history) ? d.history : [];
          ch.lastMsg = d.lastMsg || ch.lastMsg;
          ch.lastTime = d.lastTime || '';
        }
      } catch(e) { console.error('読み込み失敗:', ch.id, e); }
    });
  }

  function addMessage(text, isMe) {
    const ch = characters[currentIdx];
    const t = getTime();
    ch.msgs.push({ text, isMe, time: t });
    ch.lastMsg = text;
    ch.lastTime = t;
    renderMsg(text, isMe, t);
    saveHistory(ch);
  }

  function showTyping() {
    const ch = characters[currentIdx];
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML = `<div class="msg-avatar" style="background:${ch.avatarBg}"><img src="${ch.avatarUrl}" alt="${ch.name}"></div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    addMessage(text, true);
    setTimeout(() => showTyping(), 300);
    let reply = await getGeminiReply(text);
    if (!reply) reply = 'ごめん、ちょっと聞こえなかった…もう一回言って？😅';
    hideTyping();
    addMessage(reply, false);
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  document.getElementById('inputBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  // ===== Gemini API =====
  let availableModels = [];

  async function detectGeminiModel(apiKey) {
    availableModels = [];
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await res.json();
      if (data.error) return false;
      const EXCLUDE = ['tts', 'imagen', 'embedding', 'aqa', 'retrieval'];
      const names = (data.models || [])
        .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
        .map(m => m.name.replace('models/', ''))
        .filter(n => !EXCLUDE.some(ex => n.includes(ex)));
      console.log('利用可能モデル:', names.join(', '));
      const priority = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash-latest','gemini-1.5-flash-001','gemini-1.5-flash','gemini-1.5-pro-latest','gemini-pro'];
      for (const p of priority) { if (names.includes(p)) availableModels.push(p); }
      names.forEach(n => { if (!availableModels.includes(n) && (n.includes('flash') || n.includes('pro'))) availableModels.push(n); });
      return availableModels.length > 0;
    } catch(e) { return false; }
  }

  async function getGeminiReply(userText) {
    const apiKey = GEMINI_API_KEY || localStorage.getItem('gemini_api_key') || '';
    if (!apiKey) return '⚠️APIキーが設定されていません。⚙️を押して設定してください。';
    if (!availableModels.length) return '⚠️APIキーエラー: ⚙️から再入力してください。';

    const ch = characters[currentIdx];
    ch.history.push({ role: 'user', parts: [{ text: userText }] });

    for (const model of availableModels) {
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
          { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: ch.prompt }] },
              contents: ch.history,
              safetySettings: [
                { category: 'HARM_CATEGORY_HARASSMENT',        threshold: 'BLOCK_NONE' },
                { category: 'HARM_CATEGORY_HATE_SPEECH',       threshold: 'BLOCK_NONE' },
                { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' },
                { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' }
              ]
            })
          }
        );
        const data = await res.json();
        if (data.error) {
          const { code, message: msg = '' } = data.error;
          if (code === 429 || msg.includes('quota') || msg.includes('RESOURCE_EXHAUSTED') || msg.includes('response modalities')) { continue; }
          if (code === 403 || msg.includes('API_KEY_INVALID')) { ch.history.pop(); return '⚠️APIキーが無効です: ⚙️から確認してください。'; }
          if (code === 400) { ch.history.pop(); return '⚠️リクエストエラー: ' + msg; }
          continue;
        }
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) continue;
        ch.history.push({ role: 'model', parts: [{ text: text.trim() }] });
        return text.trim();
      } catch(e) { continue; }
    }

    ch.history.pop();
    return '⚠️全モデルでエラー。⚙️から別のAPIキーを試してください。';
  }

  // ===== APIキー設定 =====
  function showApiModal() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiModal').classList.remove('hidden');
  }

  async function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return alert('APIキーを入力してください');
    localStorage.setItem('gemini_api_key', key);
    const btn = document.querySelector('.modal-btn');
    btn.textContent = 'モデル確認中...';
    btn.disabled = true;
    const ok = await detectGeminiModel(key);
    btn.textContent = '保存して始める 💕';
    btn.disabled = false;
    document.getElementById('apiModal').classList.add('hidden');
    if (currentIdx >= 0) addMessage(ok ? '✅ AI接続完了！なんでも話しかけてね😊' : '⚠️ 使えるモデルが見つかりませんでした。キーを確認してください。', false);
  }

  async function resetAvatars() {
    characters.forEach(ch => localStorage.removeItem('avatar_' + ch.id));
    await fetchAvatars();
    renderFriendList();
  }

  async function refreshAvatar(idx) {
    const ch = characters[idx];
    localStorage.removeItem('avatar_' + ch.id);
    try {
      const res = await fetch('https://api.waifu.pics/sfw/waifu');
      const data = await res.json();
      if (data.url) {
        ch.avatarUrl = data.url;
        localStorage.setItem('avatar_' + ch.id, data.url);
        // チャット画面が開いていれば背景・ヘッダーも更新
        if (currentIdx === idx) {
          document.getElementById('chatAvatar').innerHTML = `<img src="${ch.avatarUrl}" alt="${ch.name}">`;
          document.getElementById('chatArea').style.backgroundImage = `url(${ch.avatarUrl})`;
        }
        renderFriendList();
      }
    } catch(e) {}
  }

  async function fetchAvatars() {
    await Promise.all(characters.map(async ch => {
      const saved = localStorage.getItem('avatar_' + ch.id);
      if (saved) { ch.avatarUrl = saved; return; }
      try {
        const res = await fetch('https://api.waifu.pics/sfw/waifu');
        const data = await res.json();
        if (data.url) {
          ch.avatarUrl = data.url;
          localStorage.setItem('avatar_' + ch.id, data.url);
        }
      } catch(e) { /* DiceBearフォールバックのまま */ }
    }));
  }

  window.addEventListener('load', async () => {
    loadHistory();
    await fetchAvatars();
    renderFriendList();
    const key = GEMINI_API_KEY || localStorage.getItem('gemini_api_key') || '';
    if (!key) showApiModal();
    else await detectGeminiModel(key);
  });
</script>
</body>
